<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EliteWheels - Choose Your Ride</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/carscards.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/assets/upscalemedia-transformed.png}" alt="Logo" height="60" width="110"> 
        </a>            
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/index}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/explore}">Explore</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/offers}">Offers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/support}">Support</a></li>
            </ul>
        </div>

        <div class="navbar-nav" id="profileWrapper">
		    <div class="nav-item dropdown">
		        <a href="#" class="nav-link dropdown-toggle" id="profileIcon" data-bs-toggle="dropdown">
		            <i class="bi bi-person-circle fs-4"></i>
		            <span id="userNameDisplay" class="ms-2 d-none"></span>
		        </a>
		
		        <div class="dropdown-menu dropdown-menu-end" id="profileDropdownMenu">
				    <!-- Dynamic content inserted by JS -->
				</div>

		    </div>
		</div>
    </div>
</nav>

<!-- Background Animation -->
    <div class="background-animation" id="particles"></div>
    
    <!-- Card Section -->
<section class="card-container">
    <div class="card-row">
        <!-- Affordable Card -->
        <div class="category-card" onclick="goToAffordablePage()">
		    <img th:src="@{/assets/aff-sedan-Maruti Dzire-f.avif}" alt="Affordable Car">
		    <h2>Affordable</h2>
		    <p>Rent reliable cars at budget-friendly prices for everyday travel.</p>
		    <a th:href="@{/affordable}" class="btn-choose">Choose Affordable</a>
		</div>


        <!-- Luxury Card -->
        <div class="category-card" onclick="goToLuxuryePage()">
            <img th:src="@{/assets/f9a6db2d-78dc-4e7a-8f43-c57a9e334292.jpg}" alt="Luxury Car">
            <h2>Luxury</h2>
            <p>Experience premium comfort and style with our luxury fleet.</p>
            <a th:href="@{/luxury}" class="btn-choose">Choose Luxury</a>

        </div>
    </div>
</section>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/carscards.js"></script>
</body>
</html>
