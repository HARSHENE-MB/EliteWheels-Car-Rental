<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - EliteWheels Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/usermanagement.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- Hamburger Menu for Mobile -->
    <button class="hamburger" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar">
        <p class="logo">Admin Panel</p>
        <div class="section-header">Overview</div>
        <ul>
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a th:href="@{/admin/reporting}"><i class="fas fa-chart-line"></i> Reporting</a></li>
        </ul>
        <div class="section-header">Manage</div>
        <ul>
           <li><a th:href="@{/admin/bookings}"><i class="fas fa-calendar-alt"></i> Bookings</a></li>
            
            <li><a th:href="@{/admin/carmanagement}"><i class="fas fa-tools"></i> Car Management</a></li>
           
            <li><a th:href="@{/admin/users}"><i class="fas fa-users"></i> User Management</a></li>
            <li><a th:href="@{/admin/support}"><i class="fas fa-headset"></i> Support Management</a></li>
        </ul>
        <div class="section-header">Settings</div>
        <ul>
            <li><a th:href="@{/admin/settings}"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </div>

    <!-- Top Buttons -->
    <div class="top-buttons">
        <button class="notification-btn" onclick="showNotifications()">
            <i class="bi bi-bell"></i>
        </button>
        <button class="logout-btn" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <h1>User Management</h1>
            <div th:if="${success}" class="alert alert-success" th:text="${success}" th:remove="all"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}" th:remove="all"></div>

            <!-- User Table -->
            <div class="card">
                <div class="card-header">
                    <h3>All Users</h3>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="usersTable">
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Phone</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Reg. Date</th>
                                    <th scope="col">Profile</th>
                                    <th scope="col">ID Proof</th>
                                    <th scope="col">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Populated via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination -->
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- Populated via JavaScript -->
                        </ul>
                    </nav>
                </div>
            </div>

            <!-- User Edit Modal -->
            <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="userModalLabel">Edit User</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="userForm" enctype="multipart/form-data">
                                <input type="hidden" id="userId">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="firstName" class="form-label">First Name</label>
                                        <input type="text" id="firstName" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="middleName" class="form-label">Middle Name</label>
                                        <input type="text" id="middleName" class="form-control">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="lastName" class="form-label">Last Name</label>
                                        <input type="text" id="lastName" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="dob" class="form-label">Date of Birth</label>
                                        <input type="date" id="dob" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="gender" class="form-label">Gender</label>
                                        <select id="gender" class="form-select" required>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="nationality" class="form-label">Nationality</label>
                                        <input type="text" id="nationality" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="occupation" class="form-label">Occupation</label>
                                        <input type="text" id="occupation" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" id="email" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="text" id="phone" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="address" class="form-label">Address</label>
                                        <input type="text" id="address" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="state" class="form-label">State</label>
                                        <input type="text" id="state" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="pincode" class="form-label">Pincode</label>
                                        <input type="text" id="pincode" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="idProofType" class="form-label">ID Proof Type</label>
                                        <select id="idProofType" class="form-select" required>
                                            <option value="pdf">PDF</option>
                                            <option value="jpg">JPG</option>
                                            <option value="png">PNG</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="drivingLicenseNumber" class="form-label">Driving License Number</label>
                                        <input type="text" id="drivingLicenseNumber" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="roleId" class="form-label">Role</label>
                                        <select id="roleId" class="form-select" required>
                                            <!-- Populated via JavaScript -->
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="idProof" class="form-label">ID Proof</label>
                                        <input type="file" id="idProof" class="form-control" accept=".pdf,.jpg,.png">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <div class="form-check">
                                            <input type="checkbox" id="termsAndConditions" class="form-check-input" required>
                                            <label for="termsAndConditions" class="form-check-label">Terms and Conditions</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <div class="form-check">
                                            <input type="checkbox" id="dataHandlingConsent" class="form-check-input" required>
                                            <label for="dataHandlingConsent" class="form-check-label">Data Handling Consent</label>
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">Save User</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Detail Modal -->
            <div class="modal fade" id="userDetailModal" tabindex="-1" aria-labelledby="userDetailModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                    <div class="modal-content rounded-4">
                        <div class="modal-header">
                            <h5 class="modal-title" id="userDetailModalLabel">User Details</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body" id="userDetailBody">
                            <!-- User details will be inserted here -->
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/usermanagement.js}"></script>
</body>
</html>
