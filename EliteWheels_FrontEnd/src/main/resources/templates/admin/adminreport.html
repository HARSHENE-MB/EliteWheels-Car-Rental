<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporting - EliteWheels Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/adminreport.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- Hamburger Menu for Mobile -->
    <button class="hamburger" onclick="toggleSidebar()">
        <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar">
        <p class="logo">Admin Panel</p>
        <div class="section-header">Overview</div>
        <ul>
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a th:href="@{/admin/reporting}" class="active"><i class="fas fa-chart-line"></i> Reporting</a></li>
        </ul>
        <div class="section-header">Manage</div>
        <ul>
            
            <li><a th:href="@{/admin/bookings}"><i class="fas fa-calendar-alt"></i> Bookings</a></li>
            
            <li><a th:href="@{/admin/carmanagement}"><i class="fas fa-tools"></i> Car Management</a></li>
           
            <li><a th:href="@{/admin/users}"><i class="fas fa-users"></i> User Management</a></li>
            <li><a th:href="@{/admin/support}"><i class="fas fa-headset"></i> Support Management</a></li>
        </ul>
        <div class="section-header">Settings</div>
        <ul>
            <li><a th:href="@{/admin/settings}"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </div>

    <!-- Top Buttons -->
    <div class="top-buttons">
        <button class="notification-btn" onclick="showNotifications()">
            <i class="bi bi-bell"></i>
        </button>
        <button class="logout-btn" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <h1 class="mb-4">Reporting</h1>

            <!-- Report Filters -->
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Generate Report</h5>
                </div>
                <div class="card-body">
                    <form id="reportForm" class="row g-3 align-items-end">
                        <div class="col-md-3 col-sm-6">
                            <label for="reportType" class="form-label">Report Type</label>
                            <select id="reportType" class="form-select" onchange="updateFilters()">
                                <option value="bookings">Bookings</option>
                                <option value="customers">Customer Details</option>
                                <option value="payments">Payments</option>
                            </select>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label for="startDate" class="form-label">Start Date</label>
                            <input type="date" id="startDate" class="form-control">
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label for="endDate" class="form-label">End Date</label>
                            <input type="date" id="endDate" class="form-control">
                        </div>
                        <div class="col-md-3 col-sm-6 d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">Generate</button>
                            <button type="button" class="btn btn-outline-secondary flex-fill" onclick="resetFilters()">Reset</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Report Results -->
            <div class="card shadow-sm">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Report Results</h5>
                    <button class="btn btn-success btn-sm" onclick="exportReport()" disabled id="exportButton">Export as PDF</button>
                </div>
                <div class="card-body">
                    <div id="reportContent">
                        <p class="text-muted">Please generate a report to view the results.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/adminreport.js}"></script>
</body>
</html>
